services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gtstore
      POSTGRES_USER: gtstore
      POSTGRES_PASSWORD: gtstore
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtstore"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: gtstore
      MINIO_ROOT_PASSWORD: gtstore-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
