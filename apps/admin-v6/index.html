<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="./gstore-mark.png?v=3" type="image/png" sizes="64x64">

    html,body{margin:0;min-height:100%;background:#ebe5db;color:#2a2724;font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif}

    #app:empty:before{content:"";width:56px;height:56px;border-radius:14px;background:#c45a32 url("./gstore-mark.png?v=3") center/72% no-repeat;box-shadow:0 10px 28px rgba(0,0,0,.18);animation:gtPulse 1.2s ease-in-out infinite}
