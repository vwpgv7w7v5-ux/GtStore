<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GtStore</title><link rel="stylesheet" href="/app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script>(function(){try{var t=window.Telegram&&Telegram.WebApp;if(!t)return;t.ready();t.expand()}catch(e){}})()</script></head><body class="store-body"><div class="store-shell"><header class="store-head"><div><b id="shopName">GtStore</b><p id="shopDescription"></p></div><span>Mini App</span></header><section id="storeBanners" class="store-banners"></section><section id="storeTiles" class="store-tiles"></section><nav id="categories" class="store-cats"></nav><main id="products" class="store-grid"></main></div><button id="cartbar" class="cartbar"><span>Корзина · <b id="cartCount">0</b></span><strong id="cartTotal">0 ₽</strong></button><div id="checkout" class="checkout"><div class="checkout-box"><button class="checkout-close" onclick="closeCheckout()">×</button><h2>Оформление заказа</h2><label>Имя<input id="customerName"></label><label>Телефон<input id="customerPhone"></label><label>Промокод или реферальный код<div class="inline-field"><input id="promoCode"><button id="applyPromo" class="btn">Применить</button></div></label><p id="promoResult" class="muted"></p><label>Доставка<select id="deliveryMethod"></select></label><label>Оплата<select id="paymentMethodStore"></select></label><div id="dynamicPaymentFields"></div><button id="placeOrder" class="btn primary">Создать заказ</button></div></div><script src="/store.js"></script></body></html>
